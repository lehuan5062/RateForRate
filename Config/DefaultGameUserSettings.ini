[/Script/Engine.GameUserSettings]
; The window can be any shape (no letterbox), so any resolution works. Starts BORDERLESS (mode 1: a window the size of the desktop; a tester's exclusive fullscreen fell back to 640x480
; on one machine), and the see-through window needs borderless anyway. Alt+Enter toggles fullscreen,
; and the settings menu (gear button, top right) picks Fullscreen (0), Borderless (1) or Windowed (2) and saves the choice.
; Version must match UE_GAMEUSERSETTINGS_VERSION: without it the engine ignores this file at startup.
Version=5
bUseVSync=True
bUseDesktopResolution=True
ResolutionSizeX=0
ResolutionSizeY=0
LastUserConfirmedResolutionSizeX=0
LastUserConfirmedResolutionSizeY=0
FullscreenMode=1
LastConfirmedFullscreenMode=1
PreferredFullscreenMode=1
